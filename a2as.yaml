networks:
  api.atlassian.com:
    type: api
    actions: [GET]
    urls: ['/{...}', /oauth/token/accessible-resources]
    protocols: [https]
    ports: ["443"]
    params:
      pattern: https://api.atlassian.com/ex/jira/{conn.jira_cloud_id}/rest/api/3/project
      caller: [fetch_jira_projects, jira_callback, jira_callback_post]
  api.atlassian.com.1:
    type: api
    actions: [GET]
    urls: ['/{...}']
    protocols: [https]
    ports: ["443"]
    params:
      pattern: https://api.atlassian.com/ex/jira/{conn.jira_cloud_id}/rest/api/3/search/jql
      caller: [fetch_jira_requirements]
  api.atlassian.com.2:
    type: api
    actions: [GET]
    urls: ['/{...}']
    protocols: [https]
    ports: ["443"]
    params:
      pattern: https://api.atlassian.com/ex/jira/{conn.jira_cloud_id}/rest/api/3/issue
      caller: [create_jira_test_case]
  api_url:
    type: api
    actions: [GET]
    protocols: [https]
    ports: ["443"]
    params:
      pattern: https://{JIRA_DOMAIN}/rest/api/3/project
      caller: [test_jira_connection]
      dynamic: "True"
      variable: api_url
  auth.atlassian.com:
    type: api
    actions: [POST]
    urls: [/oauth/token]
    protocols: [https]
    ports: ["443"]
    params:
      caller: [refresh_token_if_needed, jira_callback, jira_callback_post]
  auth.atlassian.com.1:
    type: api
    actions: [GET]
    urls: ['/{...}']
    protocols: [https]
    ports: ["443"]
    params:
      pattern: https://auth.atlassian.com/authorize?{urlencode}
      caller: [jira_connect]
  localhost:
    type: api
    actions: [GET]
    urls: ['/jira-connected?success=true']
    protocols: [http]
    ports: ["5173"]
    params:
      caller: [jira_callback]
      links: [url]
